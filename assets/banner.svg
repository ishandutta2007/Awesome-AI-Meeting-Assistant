<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 54px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic animated elements in background */
    @keyframes pulse {
      0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
    }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    @keyframes wave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }

    .bg-circle-1 { animation: pulse 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-circle-2 { animation: pulse 10s ease-in-out infinite reverse; transform-origin: 1000px 200px; }
    .floating-card { animation: float 6s ease-in-out infinite; }
    .soundwave { stroke-dasharray: 6 6; animation: wave 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  
  <!-- Dynamic Background Glowing Orbs -->
  <circle class="bg-circle-1" cx="200" cy="80" r="180" fill="url(#glow)"/>
  <circle class="bg-circle-2" cx="1000" cy="220" r="220" fill="url(#glow)"/>

  <!-- Decorative Audio Waveform Background pattern -->
  <g opacity="0.15" stroke="url(#accent)" stroke-width="3" fill="none">
    <path d="M 50,150 Q 150,50 250,150 T 450,150 T 650,150 T 850,150 T 1050,150 T 1150,150" class="soundwave" />
    <path d="M 50,180 Q 150,100 250,180 T 450,180 T 650,180 T 850,180 T 1050,180 T 1150,180" class="soundwave" style="animation-duration: 6s;" />
  </g>

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.05">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- Content Container (Kept safely in foreground) -->
  <g transform="translate(80, 0)">
    <!-- Icon Group -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accent)"/>
      <!-- Mic + Sparkle SVG Icon -->
      <path d="M28 14 C23.58 14 20 17.58 20 22 V30 C20 34.42 23.58 38 28 38 C32.42 38 36 34.42 36 30 V22 C36 17.58 32.42 14 28 14 Z" fill="#ffffff"/>
      <path d="M16 28 V30 C16 36.63 21.37 42 28 42 C34.63 42 40 36.63 40 30 V28 H37 V30 C37 34.97 32.97 39 28 39 C23.03 39 19 34.97 19 30 V28 H16 Z" fill="#ffffff"/>
      <rect x="26.5" y="42" width="3" height="6" fill="#ffffff"/>
    </g>

    <!-- Title & Subtitle -->
    <text x="76" y="110" class="title">Awesome AI Meeting Assistant</text>
    <text x="0" y="165" class="subtitle">Curated list of AI transcription, diarization, meeting notes &amp; intelligence tools</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="70" y="21" text-anchor="middle" class="badge-text">🎙️ Transcription</text>

      <!-- Badge 2 -->
      <rect x="152" y="0" width="145" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="224.5" y="21" text-anchor="middle" class="badge-text">🤖 Local LLMs</text>

      <!-- Badge 3 -->
      <rect x="309" y="0" width="165" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="391.5" y="21" text-anchor="middle" class="badge-text">⚡ Open &amp; Commercial</text>

      <!-- Badge 4 -->
      <rect x="486" y="0" width="135" height="32" rx="16" fill="#334155" opacity="0.8"/>
      <text x="553.5" y="21" text-anchor="middle" class="badge-text">🔒 Privacy First</text>
    </g>
  </g>
</svg>
